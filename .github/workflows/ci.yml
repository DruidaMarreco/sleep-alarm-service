name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All stages run through uv (https://docs.astral.sh/uv/). `uv sync` installs the
# runtime deps plus the `dev` dependency-group (black/ruff/ty/pytest).

jobs:
  # ─── Lint & Format ──────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: ruff (lint)
        run: uv run ruff check .
      - name: black (format check)
        run: uv run black --check .

  # ─── Type-check ─────────────────────────────────────────────────
  typecheck:
    name: Type-check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run ty check src

  # ─── Unit & Integration Tests (with coverage gate) ──────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      # Unit + integration run together so the coverage gate sees the full suite.
      - run: uv run pytest src/tests/unit_testing src/tests/integration_testing

  # ─── Metrics / Mass Testing (DISABLED) ──────────────────────────
  # Uncomment when ground-truth datasets are ready. Excluded from the default
  # pytest run via `--ignore=src/tests/mass_testing` in pyproject.toml.
