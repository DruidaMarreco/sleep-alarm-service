[project]
name = "sleep-alarm-service"
version = "0.1.0"
description = "FastAPI microservice that returns the wake time from a Google Calendar sleep event."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.149.0",
    "tzdata==2025.2",
]

[dependency-groups]
# Dev tooling, installed by `uv sync` by default. Pure-Python, fast.
# Toolchain: black (format) · ruff (lint) · ty (type-check) · pytest (test).
dev = [
    "black>=24",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_alarm_service"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src/tests"]
pythonpath = ["src"]
# importlib mode keeps discovery independent of layout; coverage gate is scoped
# to the service module (extract_token.py is a one-shot OAuth helper, not tested).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--ignore=src/tests/mass_testing",
    "--cov=sleep_alarm_service.main",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["sleep_alarm_service.main"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
